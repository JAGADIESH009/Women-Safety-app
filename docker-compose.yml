version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: women_safety_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: womensafetydb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: women_safety_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  # MQTT can be added here in Phase 3

volumes:
  postgres_data:
